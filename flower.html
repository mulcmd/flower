<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOWER FOR YOU</title>
    <!-- Tailwind CSS for modern layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for romantic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #rgb0_20px_rgba0%, # 100%);
            overflow: hidden;
            touch-action: manipulation;
        }

        .font-romantic {
            font-family: 'Great Vibes', cursive;
        }

        .font-cinzel {
            font-family: 'Cinzel Decorative', cursive;
        }

        /* Neon Glowing Effects */
        .neon-glow-pink {
            text-shadow: 0 0 10px   rgb(255, 0 , 0 , 0.8),
                         0 0 20px rgba(236, 72, 153, 0.6),
                         0 0 40px rgba(219, 39, 119, 0.4);
        }

        .neon-glow-purple {
            filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.7))
                    drop-shadow(0 0 30px rgba(236, 72, 153, 0.5));
        }

        /* Heart Pulse Animation */
        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 15px rgba(236, 72, 153, 0.8));
            }
            50% {
                transform: scale(1.08);
                filter: drop-shadow(0 0 35px rgba(244, 114, 182, 1));
            }
        }

        .pulse-heart {
            animation: pulseGlow 2s infinite ease-in-out;
        }

        /* Floating particles animation */
        @keyframes floatUp {
            0% {
                transform: translateY(0px) translateX(0px) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) translateX(50px) rotate(360deg);
                opacity: 0;
            }
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, #ffccd5 0%, #ff758c 100%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatUp linear infinite;
        }

        /* Flower Bloom Transitions */
        .flower-stem {
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            transition: stroke-dashoffset 2.5s cubic-bezier(0.4, 0, 0.2, 1) 0.5s;
        }

        .bloomed .flower-stem {
            stroke-dashoffset: 0;
        }

        .rose-petal {
            transform-origin: center;
            transform: scale(0) rotate(-15deg);
            opacity: 0;
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .bloomed .rose-petal {
            transform: scale(1) rotate(0deg);
            opacity: 0.92;
        }

        /* Staggered delay for petals */
        .petal-1 { transition-delay: 0.8s; }
        .petal-2 { transition-delay: 1.0s; }
        .petal-3 { transition-delay: 1.2s; }
        .petal-4 { transition-delay: 1.4s; }
        .petal-5 { transition-delay: 1.6s; }
        .petal-6 { transition-delay: 1.8s; }
        .petal-center { transition-delay: 2.1s; transform: scale(0); }
        .bloomed .petal-center { transform: scale(1); }

        /* Glassmorphism Letter Card */
        .glass-card {
            background: rgba(26, 11, 46, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(244, 114, 182, 0.3);
            box-shadow: 0 0 50px rgba(236, 72, 153, 0.25), inset 0 0 20px rgba(168, 85, 247, 0.1);
        }
    </style>
</head>
<body class="relative w-screen h-screen flex flex-col items-center justify-between py-8 md:py-12 select-none">

    <!-- Ambient Glow Background Orbs -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-10 left-10 w-72 h-72 bg-pink-600/15 rounded-full blur-[100px] pointer-events-none"></div>

    <!-- Starry Night Background Container -->
    <div id="stars-container" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- Header Title -->
    <div id="header-box" class="z-10 text-center transition-all duration-700 px-4">
        <h1 class="font-cinzel text-2xl sm:text-4xl md:text-5xl tracking-widest text-pink-300 neon-glow-pink uppercase mb-2">
            pencet ini yaaa
        </h1>
        <p class="text-xs sm:text-sm text-purple-200 tracking-wider font-light opacity-90 animate-pulse">
            flower and love✨
        </p>
    </div>

    <!-- Interactive Center Area -->
    <div id="interactive-stage" class="relative z-10 flex flex-col items-center justify-center cursor-pointer my-auto transition-transform duration-500 hover:scale-105 active:scale-95" onclick="triggerBloom()">
        
        <!-- Glowing Initial Heart Icon -->
        <div id="initial-heart" class="pulse-heart transition-all duration-700 flex flex-col items-center">
            <svg class="w-28 h-28 sm:w-36 sm:h-36 text-pink-500 fill-current drop-shadow-[0_0_20px_rgba(236,72,153,0.8)]" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span class="text-xs uppercase tracking-widest text-pink-200 mt-3 font-medium bg-pink-950/60 px-4 py-1.5 rounded-full border border-pink-500/30 backdrop-blur-md">Touch Heart</span>
        </div>

        <!-- Realistic Blooming Rose SVG (Hidden Initially) -->
        <div id="flower-wrapper" class="relative w-64 h-80 sm:w-80 sm:h-96 opacity-0 scale-50 transition-all duration-1000 flex items-center justify-center pointer-events-none">
            <svg class="w-full h-full neon-glow-purple overflow-visible" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradients for realistic rose petals -->
                    <linearGradient id="roseGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff758c" />
                        <stop offset="50%" stop-color="#ff4b6b" />
                        <stop offset="100%" stop-color="#9b1d53" />
                    </linearGradient>
                    <linearGradient id="roseGradient2" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ff8da1" />
                        <stop offset="100%" stop-color="#d93874" />
                    </linearGradient>
                    <linearGradient id="stemGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#4ade80" />
                        <stop offset="100%" stop-color="#15803d" />
                    </linearGradient>
                </defs>

                <!-- Stem & Leaves -->
                <g id="stem-group">
                    <!-- Curved stem -->
                    <path class="flower-stem" d="M150 180 Q140 260 150 380" fill="none" stroke="url(#stemGradient)" stroke-width="5" stroke-linecap="round"/>
                    <!-- Left leaf -->
                    <path class="flower-stem opacity-0 transition-opacity duration-700 delay-1000" d="M145 280 Q110 260 90 280 Q110 310 145 290 Z" fill="url(#stemGradient)"/>
                    <!-- Right leaf -->
                    <path class="flower-stem opacity-0 transition-opacity duration-700 delay-1000" d="M148 320 Q180 300 200 325 Q180 355 148 335 Z" fill="url(#stemGradient)"/>
                </g>

                <!-- Rose Head Group (Centered at x:150, y:130) -->
                <g transform="translate(150, 130)">
                    <!-- Outer Petals -->
                    <path class="rose-petal petal-1" d="M0 0 C-50 -30 -70 20 -40 60 C-20 80 10 70 0 0" fill="url(#roseGradient1)" />
                    <path class="rose-petal petal-2" d="M0 0 C50 -30 70 20 40 60 C20 80 -10 70 0 0" fill="url(#roseGradient1)" />
                    <path class="rose-petal petal-3" d="M0 0 C-40 -60 40 -60 0 -10 C-30 -20 30 -20 0 0" fill="url(#roseGradient2)" />
                    <!-- Mid Layer Petals -->
                    <path class="rose-petal petal-4" d="M0 0 C-45 10 -40 -40 0 -45 C40 -40 45 10 0 0" fill="url(#roseGradient2)" />
                    <path class="rose-petal petal-5" d="M0 0 C-25 45 -45 -10 -20 -35 C0 -45 20 -25 0 0" fill="url(#roseGradient1)" />
                    <path class="rose-petal petal-6" d="M0 0 C25 45 45 -10 20 -35 C0 -45 -20 -25 0 0" fill="url(#roseGradient1)" />
                    <!-- Center Bud Spiral -->
                    <g class="petal-center transition-transform duration-1000">
                        <circle cx="0" cy="-5" r="18" fill="#ff2a5f" />
                        <path d="M-8 -5 C-8 -15 8 -15 8 -5 C8 5 -8 5 -8 -5" fill="none" stroke="#ffe4e6" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="0" cy="-5" r="6" fill="#fff1f2" />
                    </g>
                </g>
            </svg>
        </div>
    </div>

    <!-- Love Letter Modal / Popup -->
    <div id="letter-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-30 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-700">
        <div class="glass-card p-6 sm:p-10 rounded-3xl max-w-md w-full text-center transform scale-90 transition-transform duration-700 relative overflow-hidden" id="letter-card">
            <!-- Decorative corner flourishes -->
            <div class="absolute -top-10 -left-10 w-24 h-24 bg-pink-500/20 rounded-full blur-xl"></div>
            <div class="absolute -bottom-10 -right-10 w-24 h-24 bg-purple-500/20 rounded-full blur-xl"></div>

            <div class="relative z-10">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-pink-500/20 text-pink-300 text-2xl mb-4 border border-pink-500/40 shadow-inner">
                    💌
                </div>
                <h2 class="font-romantic text-4xl sm:text-5xl text-pink-200 mb-4 tracking-wide">For sindi</h2>
                <div class="w-16 h-0.5 bg-gradient-to-r from-transparent via-pink-400 to-transparent mx-auto mb-6"></div>
                <p class="text-gray-200 text-sm sm:text-base leading-relaxed font-light mb-8 px-2 italic">
                    "Seperti bunga mawar indah yang mekar di bawah bintang-bintang malam, kehadiranmu menerangi setiap sudut gelap dalam hidupku. Terima kasih telah menjadi alasan di balik senyumku setiap hari."
                </p>
                <div class="flex flex-col sm:flex-row gap-3 justify-center">
                    <button onclick="closeLetter(event)" class="bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-medium px-8 py-3 rounded-full shadow-[0_0_20px_rgba(236,72,153,0.5)] transition-all transform active:scale-95 text-sm tracking-wider uppercase">
                        Close With Love ❤️
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Generate Starry Sky Background
        const starsContainer = document.getElementById('stars-container');
        const starCount = 70;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'absolute bg-white rounded-full animate-pulse';
            const size = Math.random() * 2.5 + 0.8;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.animationDuration = `${Math.random() * 3 + 1.5}s`;
            star.style.opacity = Math.random() * 0.7 + 0.3;
            starsContainer.appendChild(star);
        }

        // Generate Floating Petal/Sparkle Particles on Bloom
        function createFloatingParticles() {
            const particleContainer = document.createElement('div');
            particleContainer.className = 'absolute inset-0 pointer-events-none z-20 overflow-hidden';
            document.body.appendChild(particleContainer);

            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 8 + 4;
                p.style.width = `${size}px`;
                p.style.height = `${size * 1.3}px`;
                p.style.left = `${Math.random() * 100}%`;
                p.style.bottom = `-20px`;
                p.style.animationDuration = `${Math.random() * 4 + 3}s`;
                p.style.animationDelay = `${Math.random() * 1.5}s`;
                particleContainer.appendChild(p);
            }
        }

        // Trigger Bloom Animation & Letter Popup
        function triggerBloom() {
            const headerBox = document.getElementById('header-box');
            const initialHeart = document.getElementById('initial-heart');
            const flowerWrapper = document.getElementById('flower-wrapper');
            const letterModal = document.getElementById('letter-modal');
            const letterCard = document.getElementById('letter-card');
            const stage = document.getElementById('interactive-stage');

            // Disable further clicks during animation
            stage.style.pointerEvents = 'none';

            // Fade out header and initial heart
            headerBox.style.opacity = '0';
            headerBox.style.transform = 'translateY(-20px)';
            initialHeart.style.opacity = '0';
            initialHeart.style.transform = 'scale(0)';

            setTimeout(() => {
                headerBox.style.display = 'none';
                initialHeart.style.display = 'none';

                // Show and bloom the flower
                flowerWrapper.classList.remove('opacity-0', 'scale-50');
                flowerWrapper.classList.add('opacity-100', 'scale-100', 'bloomed');

                // Trigger floating magical particles
                createFloatingParticles();

                // Make stem leaves visible
                const leaves = flowerWrapper.querySelectorAll('#stem-group path:not(:first-child)');
                leaves.forEach(leaf => leaf.classList.remove('opacity-0'));

                // Open Love Letter Modal after flower fully blooms
                setTimeout(() => {
                    letterModal.classList.remove('opacity-0', 'pointer-events-none');
                    letterCard.classList.remove('scale-90');
                    letterCard.classList.add('scale-100');
                }, 2200);

            }, 500);
        }

        function closeLetter(event) {
            event.stopPropagation();
            const letterModal = document.getElementById('letter-modal');
            letterModal.classList.add('opacity-0', 'pointer-events-none');
        }
    </script>
</body>
</html>
